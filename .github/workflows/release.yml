name: Release Builds (Arch Linux & Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arch-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Arch Linux package (.pkg.tar.zst) in Docker
        run: |
          docker run --rm \
            -e GITHUB_REF_NAME="${GITHUB_REF_NAME}" \
            -v "$PWD":/workspace \
            -w /workspace \
            archlinux:latest \
            bash -euxc '
              pacman -Syu --noconfirm base-devel git cmake ninja qt6-base qt6-declarative qt6-svg qt6-multimedia
              useradd -m -s /bin/bash builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
              PKGVER="${GITHUB_REF_NAME#v}"
              if [ -z "$PKGVER" ] || [ "$PKGVER" = "master" ]; then
                PKGVER=$(grep "^pkgver=" PKGBUILD | cut -d= -f2)
              fi
              git config --global --add safe.directory /workspace
              git archive --format=tar.gz --prefix=Qt6Chess-${PKGVER}/ -o qt6chess-${PKGVER}.tar.gz HEAD
              chown -R builder:builder /workspace
              su builder -c "makepkg -sf --noconfirm"
            '
          ls -lh *.pkg.tar.zst

      - name: Upload Arch workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-linux-package
          path: "*.pkg.tar.zst"

      - name: Upload Arch package to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -n "$TAG" ] && [[ "$TAG" =~ ^v ]]; then
            gh release upload "$TAG" *.pkg.tar.zst --clobber
          fi

  build-windows-package:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtmultimedia'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build with CMake & Ninja
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Package with windeployqt
        run: |
          mkdir dist
          Copy-Item build\bin\Qt6Chess.exe dist\
          windeployqt --qmldir qml dist\Qt6Chess.exe
          Compress-Archive -Path dist\* -DestinationPath qt6chess-windows-x64.zip

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Build Windows Installer (Setup.exe)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\installer.iss
          Move-Item installer\Qt6Chess-Setup-x64.exe .

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-binaries
          path: |
            qt6chess-windows-x64.zip
            Qt6Chess-Setup-x64.exe

      - name: Upload Windows binaries to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ($env:GITHUB_REF_NAME -match "^v") {
            gh release upload $env:GITHUB_REF_NAME qt6chess-windows-x64.zip Qt6Chess-Setup-x64.exe --clobber
          }
